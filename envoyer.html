<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Envoyer un message anonyme — SIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F8FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07122B" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --grad: linear-gradient(135deg, #1747C8 0%, #2F7BF5 60%, #4DB5FF 100%);
      --brand-1: #1747C8;
      --brand-2: #2F7BF5;
      --brand-3: #4DB5FF;
      --brand-text: #1747C8;
      --brand-tint: rgba(47, 123, 245, 0.10);
      --brand-ring: rgba(47, 123, 245, 0.35);

      --bg: #F3F8FF;
      --surface: #FFFFFF;
      --ink: #0A1B40;
      --ink-soft: #5B6C8F;
      --card-border: rgba(10, 27, 64, 0.09);
      --chip-bg: #E8F0FE;

      --success: #1747C8;
      --success-tint: rgba(47, 123, 245, 0.12);
      --warning: #1747C8;
      --danger: #0A2A8F;
      --danger-tint: rgba(23, 71, 200, 0.10);

      --shadow-card: 0 18px 40px -16px rgba(23, 71, 200, 0.28), 0 2px 10px rgba(10, 27, 64, 0.05);
      --shadow-btn: 0 10px 22px -8px rgba(23, 71, 200, 0.55);
      --shadow-soft: 0 2px 8px rgba(10, 27, 64, 0.06);

      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-pill: 999px;
    }

    html[data-theme="dark"] {
      --brand-text: #7DB6FF;
      --brand-tint: rgba(77, 181, 255, 0.14);
      --brand-ring: rgba(77, 181, 255, 0.40);

      --bg: #07122B;
      --surface: #0E1D42;
      --ink: #EEF4FF;
      --ink-soft: #8FA3CC;
      --card-border: rgba(238, 244, 255, 0.10);
      --chip-bg: #142654;

      --success: #7DB6FF;
      --success-tint: rgba(77, 181, 255, 0.14);
      --warning: #7DB6FF;
      --danger: #BBD6FF;
      --danger-tint: rgba(77, 181, 255, 0.14);

      --shadow-card: 0 18px 44px -14px rgba(0, 0, 0, 0.6), 0 2px 10px rgba(0, 0, 0, 0.35);
      --shadow-btn: 0 10px 24px -8px rgba(47, 123, 245, 0.6);
      --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      transition: background-color .3s ease, color .3s ease;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
    }

    .ic {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
      opacity: .45;
    }

    .glow-1 { width: 280px; height: 280px; top: -80px; right: -100px; background: var(--brand-2); }
    .glow-2 { width: 240px; height: 240px; bottom: 10%; left: -110px; background: var(--brand-3); opacity: .3; }

    :focus-visible {
      outline: 3px solid var(--brand-text);
      outline-offset: 2px;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px 40px;
      padding-top: calc(14px + env(safe-area-inset-top));
      position: relative;
      z-index: 1;
    }

    .theme-toggle {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 0 24px;
    }

    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: -0.01em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform .15s ease, box-shadow .15s ease;
      color: var(--ink);
    }

    .theme-toggle:active { transform: scale(.92); }

    .theme-toggle svg {
      width: 19px;
      height: 19px;
      position: absolute;
      inset: 0;
      margin: auto;
      transition: opacity .25s ease, transform .35s ease;
    }

    .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
    .icon-moon { opacity: 0; transform: rotate(-90deg) scale(.4); }
    html[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(90deg) scale(.4); }
    html[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0) scale(1); }

    .wrap { width: 100%; max-width: 440px; }

    .hero { text-align: center; padding: 4px 6px 26px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--brand-tint);
      border: 1px solid transparent;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--brand-text);
      margin-bottom: 22px;
    }

    .badge svg { flex-shrink: 0; }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 18px;
      background: var(--grad);
      border: 3px solid var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 28px -8px var(--brand-ring);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .username {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(21px, 6vw, 25px);
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .recipient-rank {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 8px;
      margin: 0 auto 14px;
      padding: 7px 13px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
      box-shadow: var(--shadow-soft);
    }

    .recipient-rank.is-top3 {
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.12), rgba(47, 123, 245, 0.08));
      border-color: rgba(217, 119, 6, 0.42);
      color: var(--ink);
    }

    .recipient-rank__pos {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--brand-text);
    }

    .recipient-rank.is-top3 .recipient-rank__pos {
      color: #D97706;
    }

    html[data-theme="dark"] .recipient-rank.is-top3 .recipient-rank__pos {
      color: #FBBF24;
    }

    .recipient-rank__pos .ic {
      width: 15px;
      height: 15px;
    }

    .recipient-rank__pro {
      font-weight: 700;
      color: #B45309;
    }

    html[data-theme="dark"] .recipient-rank.is-top3 .recipient-rank__pro {
      color: #FDE68A;
    }

    .recipient-rank__link {
      color: var(--brand-text);
      font-weight: 700;
      text-decoration: underline;
    }

    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(19px, 5.5vw, 23px);
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--ink);
      max-width: 340px;
      margin: 0 auto;
    }

    .headline .hl {
      background: var(--brand-tint);
      color: var(--brand-text);
      padding: 1px 8px;
      border-radius: 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 22px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar { display: none; }

    .suggestion-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform .15s ease, box-shadow .15s ease, background .2s ease, border-color .2s ease;
      white-space: nowrap;
    }

    .suggestion-btn .ic { width: 16px; height: 16px; color: var(--brand-text); }

    .suggestion-btn:hover { background: var(--brand-tint); color: var(--brand-text); border-color: transparent; }

    .suggestion-btn:active { transform: scale(.96); }

    .composer {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 20px 20px;
      box-shadow: var(--shadow-card);
      transition: box-shadow .3s ease, transform .3s ease;
      animation: settle .5s ease-out .1s backwards;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .composer:focus-within { transform: translateY(-2px); }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .input-field {
      width: 100%;
      padding: 14px 15px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--ink);
      transition: box-shadow .2s ease, border-color .2s ease;
    }

    .input-field::placeholder { color: var(--ink-soft); }

    .input-field:focus {
      outline: none;
      border-color: transparent;
      box-shadow: 0 0 0 3px var(--brand-tint), 0 0 0 1.5px var(--brand-1) inset;
    }

    textarea.input-field { min-height: 130px; resize: vertical; line-height: 1.5; }

    .char-counter {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 8px;
    }

    .char-counter.warning { color: var(--warning); }
    .char-counter.danger { color: var(--danger); font-weight: 700; }

    .btn-send {
      width: 100%;
      margin-top: 18px;
      padding: 17px;
      background: var(--grad);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16.5px;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .btn-send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -6px var(--brand-ring);
    }

    .btn-send:active:not(:disabled) { transform: scale(.98); }

    .btn-send:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-send.sending svg { animation: spin .6s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .notification {
      display: none;
      margin-top: 16px;
      background: var(--success-tint);
      color: var(--success);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.5;
      animation: slideDown .3s ease-out;
    }

    .notification.error { background: var(--danger-tint); color: var(--danger); }

    .notification .ic { margin-right: 6px; vertical-align: -3px; }

    .notification a { color: inherit; font-weight: 700; text-decoration: underline; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confetti-fall 2.5s ease-out forwards;
      z-index: 1000;
    }

    @keyframes confetti-fall {
      to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    .footer { margin-top: 36px; text-align: center; }

    .footer p { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
      text-decoration: none;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      transition: transform .15s ease, box-shadow .15s ease, background .2s ease, color .2s ease;
    }

    .footer-link:hover { background: var(--brand-tint); color: var(--brand-text); }

    .footer-link:active { transform: scale(.96); }

    @media (max-width: 380px) {
      .avatar { width: 76px; height: 76px; font-size: 28px; }
      .composer { padding: 18px 16px 16px; }
      .username { font-size: 20px; }
      .headline { font-size: 18px; }
    }
  </style>
</head>
<body>
  <!-- Icônes SVG réutilisables (aucun emoji dans l'interface) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3"/><path d="M17 6h3v2a3 3 0 0 1-3 3"/></symbol>
  </svg>

  <div class="page">
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Changer de theme" aria-pressed="false">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <main class="wrap">
      <div class="brand">
        <span class="brand-text">SIS</span>
      </div>

      <section class="hero">
        <span class="badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          100% anonyme
        </span>

        <div class="avatar" id="avatarContainer">
          <span id="avatarText">U</span>
        </div>

        <h1 class="username" id="userName">@user</h1>

        <div class="recipient-rank" id="recipientRank" hidden aria-live="polite"></div>

        <p class="headline">Balance <span class="hl">ce que tu penses vraiment</span>. Personne ne saura que c'est toi.</p>
      </section>

      <div class="chips">
        <button type="button" class="suggestion-btn" data-text="Qu'est-ce que tu penses vraiment de moi ?"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg>Opinion</button>
        <button type="button" class="suggestion-btn" data-text="Compliment ou critique ?"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg>Feedback</button>
        <button type="button" class="suggestion-btn" data-text="Un secret à partager ?"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg>Secret</button>
      </div>

      <form id="messageForm">
        <input type="text" id="receiver" hidden>

        <div class="composer">
          <label class="form-label" for="messageInput">Ton message</label>

          <textarea id="messageInput" class="input-field" placeholder="Écris ton message ici..." required maxlength="5000"></textarea>

          <div class="char-counter" id="charCounter">0 / 5000</div>
        </div>

        <button type="submit" class="btn-send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          <span class="btn-label">Envoyer</span>
        </button>
      </form>

      <div id="notif" class="notification" aria-live="polite"></div>

      <footer class="footer">
        <p>Toi aussi, reçois des messages anonymes ?</p>
        <a class="footer-link" href="/">Crée ton lien SIS<svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </footer>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, getDocs, query, orderBy, limit, setDoc, increment } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
    import { computeLeaderboard, findUserEntry, formatMessageCount } from "./leaderboard-utils.js";
    import { firebaseConfig } from "./firebase-config.js";
    import {
      getCachedRecipient, setCachedRecipient,
      getCachedLeaderboard, setCachedLeaderboard, invalidateLeaderboardCache
    } from "./sis-cache.js";

    // Configuration partagée : voir firebase-config.js

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const urlParams = new URLSearchParams(window.location.search);
    let rawPseudo = urlParams.get("to") || urlParams.get("user") || urlParams.get("pseudo") || "";
    if (!rawPseudo && window.location.pathname.startsWith('/to/')) {
      rawPseudo = window.location.pathname.slice(4);
    }
    const PSEUDO_RE = /^[a-z0-9_]{3,20}$/;
    const PHOTO_PREFIX = "https://res.cloudinary.com/duddyzckz/";
    const BODY_MAX = 5000;
    const ICON = {
      check: '<svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>',
      alert: '<svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>',
      arrow: '<svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg>'
    };
    const normalizePseudo = (v) => String(v || "").trim().replace(/^@+/, "").toLowerCase();
    const escapeHtml = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let decodedPseudo = "";
    try { decodedPseudo = decodeURIComponent(rawPseudo); } catch (e) { decodedPseudo = ""; }
    const toPseudoRaw = normalizePseudo(decodedPseudo);
    const toPseudo = PSEUDO_RE.test(toPseudoRaw) ? toPseudoRaw : "";
    const receiverInput = document.getElementById("receiver");
    const messageInput = document.getElementById("messageInput");
    const charCounter = document.getElementById("charCounter");
    const avatarContainer = document.getElementById("avatarContainer");
    const avatarText = document.getElementById("avatarText");
    const userName = document.getElementById("userName");

    if (toPseudo) {
      receiverInput.value = "@" + toPseudo;
      userName.textContent = "@" + toPseudo;
      avatarText.textContent = toPseudo.charAt(0).toUpperCase();

      loadUserProfile(toPseudo);
    } else {
      userName.textContent = "Destinataire";
      avatarText.textContent = "?";
      const heroSec = document.querySelector('.hero');
      if (heroSec) {
        const inputWrap = document.createElement('div');
        inputWrap.style.marginTop = '16px';
        inputWrap.style.width = '100%';
        inputWrap.innerHTML = `
          <input type="text" id="manualPseudo" class="input-field" placeholder="Entre le @pseudo du destinataire..." style="text-align:center;font-weight:600;font-size:16px;">
        `;
        heroSec.appendChild(inputWrap);
      }
    }

    // Annuaire public usernames/{pseudo} : existence + photo du destinataire (avec cache local).
    // Retourne les données si le pseudo existe, false s'il n'existe pas, null si on ne sait pas.
    async function fetchPseudo(pseudo) {
      const cached = getCachedRecipient(pseudo);
      if (cached) {
        return cached.exists ? { photoURL: cached.photoURL } : false;
      }
      try {
        const snap = await getDoc(doc(db, "usernames", pseudo));
        const result = snap.exists() ? (snap.data() || {}) : false;
        setCachedRecipient(pseudo, result);
        return result;
      } catch (error) {
        console.error("Erreur:", error);
        return null; // inconnu : on laisse les règles serveur trancher
      }
    }

    async function pseudoExists(pseudo) {
      const info = await fetchPseudo(pseudo);
      return info === null ? null : info !== false;
    }

    // Photo du destinataire : seules les images Cloudinary de SIS sont acceptées.
    function showRecipientPhoto(url) {
      if (typeof url !== "string" || !url.startsWith(PHOTO_PREFIX)) return;
      const img = document.createElement("img");
      img.className = "avatar-img";
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.onload = () => { avatarText.style.visibility = "hidden"; };
      img.src = url;
      avatarContainer.appendChild(img);
    }

    function renderRecipientRank(entry) {
      const rankEl = document.getElementById("recipientRank");
      if (!rankEl) return;
      rankEl.replaceChildren();
      if (!entry) {
        rankEl.hidden = true;
        return;
      }

      const isTop3 = entry.rank >= 1 && entry.rank <= 3;
      rankEl.classList.toggle("is-top3", isTop3);

      const posSpan = document.createElement("span");
      posSpan.className = "recipient-rank__pos";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "ic");
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#i-trophy");
      svg.append(use);
      posSpan.append(svg, document.createTextNode(entry.rank ? `#${entry.rank} au classement` : "Membre classé"));
      rankEl.append(posSpan);

      if (isTop3) {
        const sep = document.createElement("span");
        sep.setAttribute("aria-hidden", "true");
        sep.textContent = "·";
        const proSpan = document.createElement("span");
        proSpan.className = "recipient-rank__pro";
        proSpan.textContent = "Top 3 Pro";
        rankEl.append(sep, proSpan);
      }

      const sep2 = document.createElement("span");
      sep2.setAttribute("aria-hidden", "true");
      sep2.textContent = "·";
      const countSpan = document.createElement("span");
      countSpan.textContent = `${formatMessageCount(entry.messageCount)} reçus`;
      rankEl.append(sep2, countSpan);

      const sep3 = document.createElement("span");
      sep3.setAttribute("aria-hidden", "true");
      sep3.textContent = "·";
      const link = document.createElement("a");
      link.className = "recipient-rank__link";
      link.href = "classement.html";
      link.textContent = "Voir le classement";
      rankEl.append(sep3, link);

      rankEl.hidden = false;
    }

    async function loadRecipientRank(pseudo) {
      try {
        let rows = getCachedLeaderboard();
        if (!rows) {
          const lbQuery = query(collection(db, "leaderboard"), orderBy("messageCount", "desc"), limit(50));
          const snap = await getDocs(lbQuery);
          rows = [];
          snap.forEach((docSnap) => rows.push({ username: docSnap.id, ...docSnap.data() }));
          setCachedLeaderboard(rows);
        }
        const ranked = computeLeaderboard(rows);
        const found = findUserEntry(ranked, pseudo);
        if (found) {
          renderRecipientRank(found);
          return;
        }
        const single = await getDoc(doc(db, "leaderboard", pseudo));
        if (single.exists()) {
          const data = single.data() || {};
          renderRecipientRank({
            username: pseudo,
            messageCount: Number(data.messageCount) || 0,
            rank: null
          });
        }
      } catch (e) {
        console.warn("Rang destinataire non lu:", e);
      }
    }

    async function loadUserProfile(pseudo) {
      const rankPromise = loadRecipientRank(pseudo);
      const info = await fetchPseudo(pseudo);
      if (info === false) {
        showNotice(ICON.alert + "Ce pseudo n'existe pas. Vérifie le lien.", "error");
        return;
      }
      if (info) showRecipientPhoto(info.photoURL);
      await rankPromise;
    }

    messageInput.addEventListener("input", () => {
      const length = messageInput.value.length;
      charCounter.textContent = `${length} / 5000`;

      charCounter.classList.remove("warning", "danger");
      if (length > 4000) charCounter.classList.add("warning");
      if (length > 4800) charCounter.classList.add("danger");
    });

    document.querySelectorAll(".suggestion-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        messageInput.value = btn.dataset.text;
        messageInput.focus();
        messageInput.dispatchEvent(new Event("input"));
      });
    });

    function createConfetti() {
      const colors = ["#1747C8", "#2F7BF5", "#4DB5FF", "#BBD6FF"];
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const c = document.createElement("div");
          c.classList.add("confetti");
          c.style.left = Math.random() * window.innerWidth + "px";
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDelay = Math.random() * 0.3 + "s";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 2500);
        }, i * 20);
      }
    }

    function showNotice(html, type) {
      const notif = document.getElementById("notif");
      notif.innerHTML = html;
      notif.classList.toggle("error", type === "error");
      notif.style.display = "block";
      clearTimeout(showNotice._t);
      showNotice._t = setTimeout(() => {
        notif.style.display = "none";
        notif.classList.remove("error");
      }, 6000);
    }

    document.getElementById("messageForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = messageInput.value.trim();
      const btn = document.querySelector('.btn-send');
      const btnLabel = btn.querySelector('.btn-label');

      const manualInput = document.getElementById("manualPseudo");
      const targetPseudo = toPseudo || (manualInput ? normalizePseudo(manualInput.value) : "");

      if (!msg) {
        showNotice(ICON.alert + "Écris un message avant d'envoyer.", "error");
        return;
      }
      if (msg.length > BODY_MAX) {
        showNotice(ICON.alert + "Message trop long (5000 caractères maximum).", "error");
        return;
      }
      if (!targetPseudo || !PSEUDO_RE.test(targetPseudo)) {
        showNotice(ICON.alert + "Pseudo invalide ou manquant (3 à 20 caractères : lettres, chiffres, _).", "error");
        return;
      }

      btn.disabled = true;
      btn.classList.add('sending');
      btnLabel.textContent = "Envoi...";

      try {
        if ((await pseudoExists(targetPseudo)) === false) {
          showNotice(ICON.alert + "Ce pseudo n'existe pas.", "error");
          return;
        }

        // Aucun identifiant d'expéditeur n'est enregistré : l'envoi reste anonyme.
        await addDoc(collection(db, "messages"), {
          to: targetPseudo,
          message: msg,
          createdAt: serverTimestamp()
        });

        try {
          await setDoc(doc(db, "leaderboard", targetPseudo), {
            username: targetPseudo,
            messageCount: increment(1),
            updatedAt: new Date().toISOString()
          }, { merge: true });
          invalidateLeaderboardCache();
        } catch (lbErr) {
          console.warn("Compteur classement non mis à jour:", lbErr);
        }

        messageInput.value = "";
        charCounter.textContent = "0 / 5000";
        charCounter.classList.remove("warning", "danger");

        if (!reduceMotion) createConfetti();

        showNotice(`${ICON.check}Message anonyme envoyé à @${escapeHtml(targetPseudo)}.<br><a href="/">Crée ton propre lien SIS${ICON.arrow}</a>`, "success");
      } catch (error) {
        showNotice(ICON.alert + "Erreur : " + escapeHtml(error.code === "permission-denied" ? "envoi refusé (pseudo introuvable ou message invalide)." : error.message), "error");
      } finally {
        btn.disabled = false;
        btn.classList.remove('sending');
        btnLabel.textContent = "Envoyer";
      }
    });

    const themeToggleBtn = document.getElementById('themeToggle');
    themeToggleBtn.setAttribute('aria-pressed', String(document.documentElement.getAttribute('data-theme') === 'dark'));
    themeToggleBtn.addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      themeToggleBtn.setAttribute('aria-pressed', String(next === 'dark'));
    });
  </script>
</body>
</html>
