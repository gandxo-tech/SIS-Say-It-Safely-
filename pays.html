  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap');

    :root {
      --brand-1: #1747C8;
      --brand-2: #2F7BF5;
      --brand-3: #4DB5FF;
      --gradient: linear-gradient(135deg, #1747C8 0%, #2F7BF5 60%, #4DB5FF 100%);
      --bg: #F3F8FF;
      --card-bg: #FFFFFF;
      --text: #0A1B40;
      --text-secondary: #5B6C8F;
      --accent: #1747C8;
      --accent-secondary: #2F7BF5;
      --border: rgba(10, 27, 64, .12);
      --shadow: 0 10px 24px -14px rgba(10, 27, 64, .28);
      --shadow-hover: 0 16px 34px -16px rgba(10, 27, 64, .35);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07122B;
        --card-bg: #0E1D42;
        --text: #EEF4FF;
        --text-secondary: #8FA3CC;
        --accent: #7DB6FF;
        --accent-secondary: #4DB5FF;
        --border: rgba(238, 244, 255, .12);
        --shadow: 0 12px 28px -16px rgba(0, 0, 0, .65);
        --shadow-hover: 0 18px 40px -18px rgba(0, 0, 0, .75);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }

    .container {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    [hidden] { display: none !important; }

    h1 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -.02em;
    }

    .subtitle { color: var(--text-secondary); font-size: 15px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .country-select-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .country-select-wrap .ic { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }

    .country-select {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .country-select:focus { outline: none; border-color: var(--accent); }

    /* Carte du premier du pays */
    .top-card {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      background: var(--gradient);
      color: #fff;
    }

    .top-card .crown {
      width: 26px; height: 26px; flex-shrink: 0;
    }

    .top-card .top-name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }

    .top-card .top-meta {
      font-size: 12.5px;
      opacity: .9;
      margin-top: 2px;
    }

    .top-card .top-score {
      margin-left: auto;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    /* Liste */
    .rows { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .row:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }

    .row-rank {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .row--1 .row-rank,
    .row--2 .row-rank,
    .row--3 .row-rank {
      background: var(--gradient);
      color: #fff;
      border-color: transparent;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      background: var(--gradient);
      background-size: cover;
      background-position: center;
      color: #fff;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .row-user { flex: 1; min-width: 0; }
    .row-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { font-size: 12.5px; color: var(--text-secondary); }

    .row-score {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 26px 12px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    .error { color: #DC2626; }

    @media (max-width: 480px) {
      body { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
      h1 { font-size: 24px; }
      .card { padding: 16px; }
      .row-score { display: none; }
    }

    @media (min-width: 720px) {
      body { padding: 32px 24px calc(96px + env(safe-area-inset-bottom)); }
      h1 { font-size: 32px; }
      .container { max-width: 720px; }
    }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>Classement par pays</h1>
      <p class="subtitle">Les profils les plus contactés, pays par pays.</p>
    </div>

    <section class="card" aria-label="Choix du pays">
      <label class="label" for="countrySelect">Pays</label>
      <div class="country-select-wrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/></svg>
        <select class="country-select" id="countrySelect" aria-label="Choisir un pays">
          <option value="">Chargement…</option>
        </select>
      </div>

      <div class="top-card" id="topCard" hidden></div>
      <div class="rows" id="rows"></div>
      <p class="empty" id="emptyMsg" hidden></p>
      <p class="empty error" id="errorMsg" hidden>Impossible de charger le classement pour le moment.</p>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { mountBottomNav } from "./bottom-nav.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { countryName } from "./geo-country.js";
    import {
      computeLeaderboard,
      formatMessageCount,
      formatShortCount,
      safePhotoUrl
    } from "./leaderboard-utils.js";

    mountBottomNav("classement");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const select = $("countrySelect");
    const topCard = $("topCard");
    const rows = $("rows");
    const emptyMsg = $("emptyMsg");
    const errorMsg = $("errorMsg");

    const requested = (new URLSearchParams(location.search).get("pays") || "").toUpperCase();
    let groups = new Map(); // code pays -> entrées classées

    const avatarEl = (entry) => {
      const box = document.createElement("div");
      box.className = "avatar";
      const safe = safePhotoUrl(entry.photoURL);
      if (safe) {
        const img = new Image();
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => {
          box.replaceChildren();
          box.textContent = entry.username.charAt(0).toUpperCase();
        };
        img.src = safe;
        box.append(img);
      } else {
        box.textContent = entry.username.charAt(0).toUpperCase();
      }
      return box;
    };

    function renderCountry(code) {
      const list = groups.get(code) || [];
      rows.replaceChildren();
      topCard.replaceChildren();
      topCard.hidden = true;
      emptyMsg.hidden = true;
      errorMsg.hidden = true;

      if (list.length === 0) {
        emptyMsg.textContent = "Aucun profil classé dans ce pays pour le moment.";
        emptyMsg.hidden = false;
        return;
      }

      // Premier du pays
      const first = list[0];
      const crown = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      crown.setAttribute("class", "crown");
      crown.setAttribute("viewBox", "0 0 24 24");
      crown.setAttribute("fill", "none");
      crown.setAttribute("stroke", "currentColor");
      crown.setAttribute("stroke-width", "2");
      crown.setAttribute("stroke-linecap", "round");
      crown.setAttribute("stroke-linejoin", "round");
      crown.setAttribute("aria-hidden", "true");
      crown.setAttribute("width", "26");
      crown.setAttribute("height", "26");
      const crownPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      crownPath.setAttribute("d", "M3 18h18l-1.5-7-4.5 3-3-6-3 6-4.5-3L3 18z");
      crown.append(crownPath);

      const info = document.createElement("div");
      const name = document.createElement("div");
      name.className = "top-name";
      name.textContent = "@" + first.username;
      const meta = document.createElement("div");
      meta.className = "top-meta";
      meta.textContent = "Meilleur profil · " + (countryName(code) || code);
      info.append(name, meta);

      const score = document.createElement("div");
      score.className = "top-score";
      score.textContent = formatMessageCount(first.messageCount);

      topCard.append(crown, info, score);
      topCard.hidden = false;

      // Top 5
      list.slice(0, 5).forEach((entry) => {
        const row = document.createElement("div");
        row.className = "row row--" + (entry.rank <= 3 ? entry.rank : "n");

        const rank = document.createElement("div");
        rank.className = "row-rank";
        rank.textContent = "#" + entry.rank;

        const user = document.createElement("div");
        user.className = "row-user";
        const rowName = document.createElement("div");
        rowName.className = "row-name";
        rowName.textContent = "@" + entry.username;
        const rowMeta = document.createElement("div");
        rowMeta.className = "row-meta";
        rowMeta.textContent = countryName(code) || code;
        user.append(rowName, rowMeta);

        const rowScore = document.createElement("div");
        rowScore.className = "row-score";
        rowScore.textContent = formatShortCount(entry.messageCount) + " msg";

        row.append(rank, avatarEl(entry), user, rowScore);
        rows.append(row);
      });
    }

    function fillSelect() {
      const codes = [...groups.keys()].sort((a, b) => {
        const diff = (groups.get(b) || []).length - (groups.get(a) || []).length;
        if (diff !== 0) return diff;
        return (countryName(a) || a).localeCompare(countryName(b) || b, "fr");
      });

      select.replaceChildren(...codes.map((code) => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = (countryName(code) || code) + " · " + code;
        return opt;
      }));

      const keep = codes.includes(requested) ? requested : codes[0];
      select.value = keep;
      return keep;
    }

    select.addEventListener("change", () => {
      renderCountry(select.value);
      try {
        history.replaceState(null, "", "?pays=" + select.value);
      } catch (e) {
        // URL non modifiable : sans effet
      }
    });

    async function load() {
      try {
        // Même approche que classement.html : une seule requête triée,
        // regroupement par pays côté client (aucun index composite requis).
        const snap = await getDocs(
          query(collection(db, "leaderboard"), orderBy("messageCount", "desc"), limit(200))
        );

        const entries = [];
        snap.forEach((d) => {
          const data = d.data();
          entries.push({ ...data, username: data.username || d.id });
        });

        const ranked = computeLeaderboard(entries);
        groups = new Map();
        ranked.forEach((entry) => {
          if (!entry.countryCode) return;
          if (!groups.has(entry.countryCode)) groups.set(entry.countryCode, []);
          groups.get(entry.countryCode).push(entry);
        });

        if (groups.size === 0) {
          select.replaceChildren();
          select.disabled = true;
          errorMsg.hidden = true;
          emptyMsg.textContent = "Aucun pays renseigné pour le moment.";
          emptyMsg.hidden = false;
          return;
        }

        const keep = fillSelect();
        renderCountry(keep);
      } catch (e) {
        console.error("Classement par pays :", e);
        select.disabled = true;
        errorMsg.hidden = false;
        emptyMsg.hidden = true;
      }
    }

    load();
  </script>
</body>
