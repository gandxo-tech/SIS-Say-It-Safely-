<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SIS – Classement par pays</title>
  <meta name="description" content="Voir le classement mondial par pays sur SIS, messages anonymes.">
  <meta name="keywords" content="SIS, classement, pays, top, leaderboard">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F8FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07122B" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap');

    :root {
      --brand-1: #1747C8;
      --brand-2: #2F7BF5;
      --brand-3: #4DB5FF;
      --gradient: linear-gradient(135deg, #1747C8 0%, #2F7BF5 60%, #4DB5FF 100%);
      --tint: rgba(47, 123, 245, .10);
      --ring: rgba(47, 123, 245, .35);
      --bg: #F3F8FF;
      --card-bg: #FFFFFF;
      --text: #0A1B40;
      --text-secondary: #5B6C8F;
      --accent: #1747C8;
      --accent-secondary: #2F7BF5;
      --border: rgba(10, 27, 64, .12);
      --shadow: 0 10px 24px -14px rgba(10, 27, 64, .28);
      --shadow-hover: 0 16px 34px -16px rgba(10, 27, 64, .35);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07122B;
        --card-bg: #0E1D42;
        --text: #EEF4FF;
        --text-secondary: #8FA3CC;
        --accent: #7DB6FF;
        --accent-secondary: #4DB5FF;
        --border: rgba(238, 244, 255, .12);
        --tint: rgba(77, 181, 255, .14);
        --shadow: 0 12px 28px -16px rgba(0, 0, 0, .65);
        --shadow-hover: 0 18px 40px -18px rgba(0, 0, 0, .75);
      }

      .message, .header-section, .share-link, .auth-screen { background: var(--card-bg); }
      .warning-message { background: rgba(217, 119, 6, .14); border-color: rgba(217, 119, 6, .42); color: #FDE68A; }
      .error-message { background: rgba(185, 28, 28, .16); border-color: rgba(185, 28, 28, .45); color: #FECACA; }
      .btn-secondary:hover { color: #07122B; }
      .btn-logout:hover { color: #FFFFFF; }
      .message-header::after { color: #FFFFFF; }
      .empty { background-image: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      h1 { animation: none; }
      .message { opacity: 1; transform: none; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }

    .container {
      max-width: 820px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .container.hidden { display: none; }

    .header-section {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      flex-wrap: wrap;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .country-badge {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Country selector */
    .country-selector {
      margin-top: 8px;
      min-width: 180px;
    }

    .country-selector select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%235B6C8F' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3A");
      background-repeat: no-repeat;
      background-position: right 8px center;
      transition: border-color .2s;
    }

    .country-selector select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .country-selector option {
      padding: 8px;
    }

    /* Pays en vedette */
    .pays-vedette {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-top: 16px;
    }

    .pays-vedette .svg-icon {
      width: 48px; height: 48px; margin: 0 auto 12px;
      filter: brightness(0) saturate(1) invert(29%) sepia(50%) saturate(671%) hue-rotate(184deg) brightness(93%) contrast(96%);
    }

    .pays-vedette h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .pays-vedette .pays-code {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pays-vedette .score {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Liste des top 5 par pays */
    .top-pays-list {
      display: grid;
      gap: 16px;
    }

    .top-pays-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .top-pays-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .top-pays-rank {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gradient);
      color: white;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .top-pays-info {
      flex: 1;
    }

    .top-pays-info .name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .top-pays-info .pseudo {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .top-pays-country {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .top-pays-score {
      font-size: 13px;
      color: var(--accent-secondary);
      white-space: nowrap;
    }

    /* États */
    .empty, .warning-message, .error-message {
      text-align: center;
      padding: 40px 20px;
    }

    .empty svg, .error-message svg { width: 40px; height: 40px; margin-bottom: 12px; }

    .warning-message {
      background: #fff9e6; border: 2px solid #ffa500; color: #cc8800;
    }

    .error-message {
      background: #fff3f3; border: 2px solid #ff4444; color: #cc0000;
    }

    .warning-message strong, .error-message strong { display: block; margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 16px; }
      h1 { font-size: 24px; }
      .subtitle { font-size: 13px; }
      .country-selector { min-width: 140px; }
      .country-selector select { padding: 10px; font-size: 13px; }
    }

    @media (min-width: 720px) {
      body { padding: 32px 24px calc(96px + env(safe-area-inset-bottom)); }
      h1 { font-size: 32px; }
    }

    @media (min-width: 1024px) {
      .container { max-width: 980px; }
    }

    /* Focus visible */
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="header-section">
      <div class="logo-section">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="country-badge" id="countryBadge">FR</span>
      </div>
      <h1>Classement par pays</h1>
      <p class="subtitle">Choisis un pays pour voir le top des profils</p>
    </div>

    <div class="country-selector" id="countrySelector">
      <select id="countrySelect" aria-label="Sélectionner un pays">
        <option value="FR">France 🇫🇷</option>
        <option value="US">États‑Unis 🇺🇸</option>
        <option value="CA">Canada 🇨🇦</option>
        <option value="GB">Royaume‑Uni 🇬🇧</option>
        <option value="DE">Allemagne 🇩🇪</option>
        <option value="JP">Japon 🇯🇵</option>
        <option value="BR">Brésil 🇧🇷</option>
        <option value="IN">Inde 🇮🇳</option>
        <option value="AU">Australie 🇦🇺</option>
        <option value="XU">Tous les pays</option>
      </select>
    </div>

    <div class="pays-vedette" id="paysVedette" hidden>
      <div class="svg-icon" id="vedetteSvg"></div>
      <h2 id="vedetteTitre">Chargement...</h2>
      <p class="pays-code" id="vedetteCode">—</p>
      <p class="score" id="vedetteScore">—</p>
    </div>

    <div class="top-pays-list" id="topPaysList">
      <p class="empty" id="emptyMsg">Sélectionne un pays ci‑dessus pour voir le top 5.</p>
    </div>

    <div class="empty" id="noDataMsg" hidden>Aucun données pour le moment.</div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, limit, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getUserCountry, pickCountry } from "./geo-country.js";
    import { publicProfileLink, safePhotoUrl } from "./leaderboard-utils.js";
    import { mountBottomNav } from "./bottom-nav.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    mountBottomNav("messages");

    // --- Récupération du paramètre URL `?pays=` ---
    const urlParams = new URLSearchParams(location.search);
    const urlPays = urlParams.get('pays'); // ex: "FR"

    // --- État du pays (depuis URL ou sélecteur) ---
    let currentCountry = urlPays || 'FR'; // fallback FR si rien en URL

    // Mapping visuel des codes pays -> libellé + drapeau SVG (emoji-free)
    const countryLabels = {
      FR: { label: 'France', emoji: '🇫🇷', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' },
      US: { label: 'États-Unis', emoji: '🇺🇸', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v3c0 6 8 10 8 10z"/>' },
      CA: { label: 'Canada', emoji: '🇨🇦', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4l10 11-10 11zM2 12l5.06 6.76L2 22l10-6.1L2 2l-10 6.1L2 12z"/>' },
      GB: { label: 'Royaume-Uni', emoji: '🇬🇧', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4l9 11-9 11h2l9-11-9-11h2zM2 12l5.06 6.76L2 22l10-6.1L2 2l-10 6.1L2 12z"/>' },
      DE: { label: 'Allemagne', emoji: '🇩🇪', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 4h6l-3 9h-6l3-9zM12 22h.01M5.99 5.99L1 1l4.94 4.94M21 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"/>' },
      JP: { label: 'Japon', emoji: '🇯🇵', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 4h6l-3 9h-6l3-9zM2 12l10 11-10 11L2 22l10-11L2 2z"/>' },
      BR: { label: 'Brésil', emoji: '🇧🇷', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 4h6l-3 9h-6l3-9zM2 12l5.06 6.76L2 22l10-6.1L2 2l-10 6.1L2 12zM.09 5.91L1 8.09l4.94 4.94M21 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"/>' },
      IN: { label: 'Inde', emoji: '🇮🇳', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 4h6l-3 9h-6l3-9zM2 12l5.06 6.76L2 22l10-6.1L2 2l-10 6.1L2 12zM12 22h.01"/>' },
      AU: { label: 'Australie', emoji: '🇦🇺', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 4h6l-3 9h-6l3-9zM2 12l5.06 6.76L2 22l10-6.1L2 2l-10 6.1L2 12zM.09 5.91L1 8.09l4.94 4.94M21 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"/>' }
    };

    // --- Éléments DOM ---
    const countrySelect = $('countrySelect');
    const countryBadge = $('countryBadge');
    const paysVedette = $('paysVedette');
    const vedetteSvg = $('vedetteSvg');
    const vedetteTitre = $('vedetteTitre');
    const vedetteCode = $('vedetteCode');
    const vedetteScore = $('vedetteScore');
    const topPaysList = $('topPaysList');
    const emptyMsg = $('emptyMsg');
    const noDataMsg = $('noDataMsg');

    // --- Mise à jour de l'affichage du pays ---
    function updateCountryDisplay(countryCode) {
      currentCountry = countryCode;
      const info = countryLabels[countryCode] || countryLabels['FR'];

      // Badge dans l'en-tête
      countryBadge.textContent = info.label;
      countryBadge.innerHTML = info.svg || '';

      // Filtre les données
      filterAndDisplay(countryCode);
    }

    // --- Lecture du sélecteur + URL ---
    if (urlPays) {
      // Si l'URL a un paramètre, on le sélectionne
      countrySelect.value = urlPays;
      updateCountryDisplay(urlPays);
    } else {
      // Sinon, on choisit le pays par défaut (FR si dispo, sinon premier)
      countrySelect.value = currentCountry;
      updateCountryDisplay(currentCountry);
    }

    // --- Écouteur changement sélecteur ---
    countrySelect.addEventListener('change', (e) => {
      const chosen = e.target.value;
      updateCountryDisplay(chosen);
      // On met à jour l'URL sans recharger (history.pushState)
      const newSearch = new URLSearchParams(location.search);
      newSearch.set('pays', chosen);
      // On enlève les autres params pays
      for (const key of newSearch.keys()) {
        if (key !== 'pays') newSearch.delete(key);
      }
      history.pushState({}, '', '?' + newSearch.toString());
    });

    // --- Fonction : filtrer et afficher le top 5 ---
    async function filterAndDisplay(countryCode) {
      showEmpty(false);
      showNoData(false);

      try {
        const countryInfo = countryLabels[countryCode];
        if (!countryInfo) {
          showEmpty(true);
          showNoData(true);
          return;
        }

        // Afficher l'encart "pays en vedette" avec le top 1
        const topRef = collection(db, 'leaderboard');
        const q = query(topRef, where('countryCode', '==', countryCode), orderBy('score', 'desc'), limit(1));
        const snap = await getDocs(q);

        if (snap.empty) {
          // Pas de données pour ce pays
          vedetteSvg.innerHTML = countryInfo.svg || '';
          vedetteTitre.textContent = `${countryInfo.label} – Pas de classement encore`;
          vedetteCode.textContent = `Code : ${countryCode}`;
          vedetteScore.textContent = '—';
          $('paysVedette').hidden = false;
          topPaysList.innerHTML = '';
          showEmpty(true);
          showNoData(false);
          return;
        }

        const topDoc = snap.docs[0];
        const data = topDoc.data();
        const pseudo = data.username || data.pseudo || 'Inconnu';
        const score = data.score || 0;
        const photoURL = data.photoURL || '';

        // Carte vedette
        vedetteSvg.innerHTML = countryInfo.svg || '';
        vedetteTitre.textContent = `@${pseudo}`;
        vedetteCode.textContent = `Code : ${countryCode}`;
        vedetteScore.textContent = String(score);
        $('paysVedette').hidden = false;

        // Liste top 5
        const q5 = query(topRef, where('countryCode', '==', countryCode), orderBy('score', 'desc'), limit(5));
        const snap5 = await getDocs(q5);

        if (snap5.empty) {
          topPaysList.innerHTML = '<p class="empty">Aucun message pour le moment.</p>';
          showEmpty(true);
          showNoData(false);
          return;
        }

        let html = '';
        snap5.forEach((doc, idx) => {
          const d = doc.data();
          const p = d.username || d.pseudo || `Anonyme${idx + 1}`;
          const s = d.score || 0;
          const ph = safePhotoUrl(d.photoURL);
          const avatarHtml = ph ? `<img src="${ph}" alt="@${p}" class="avatar-small">` : `<div class="avatar-small avatar-initiale">${p.charAt(0).toUpperCase()}</div>`;
          html += `
            <div class="top-pays-item">
              <div class="top-pays-rank">${idx + 1}</div>
              <div class="top-pays-info">
                <div class="top-pays-name">${p}</div>
                <div class="top-pays-pseudo">@${p}</div>
                <div class="top-pays-country">${countryInfo.label}</div>
              </div>
              <div class="top-pays-score">${s} pts</div>
            </div>
          `;
        });

        topPaysList.innerHTML = html;
        showEmpty(false);
        showNoData(false);

      } catch (err) {
        console.error('Erreur chargement classement par pays :', err);
        showEmpty(true);
        showNoData(true);
      }
    }

    // --- Aides affichage ---
    function showEmpty(show) {
      emptyMsg.hidden = !show;
      if (show) topPaysList.innerHTML = '<p class="empty">Sélectionne un pays ci‑dessus pour voir le top 5.</p>';
    }
    function showNoData(show) {
      noDataMsg.hidden = !show;
    }

    // --- Au chargement : si paramètre URL, s'assurer qu'on l'a appliqué ---
    // (déjà fait ci-dessus via la condition URLSearchParams)

    </script>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { mountBottomNav } from "./bottom-nav.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Si pas connecté, on peut cacher le bas du page ou afficher un msg
        // mountBottomNav("messages"); deja fait plus haut
      }
    });
  </script>
</body>
</html>
