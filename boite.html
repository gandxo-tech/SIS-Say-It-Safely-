<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes messages — SIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0b1e; color: #fff; margin: 0; min-height: 100vh; padding: 24px; }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 2rem; margin: 0 0 4px; background: linear-gradient(90deg,#6366f1,#a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { opacity: .7; margin: 0 0 16px; }
    .hidden { display: none; }
    input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #3b2f63; background: #1a1433; color: #fff; margin-bottom: 10px; font: inherit; }
    button { font: inherit; color: #fff; cursor: pointer; }
    .primary { width: 100%; padding: 12px; border: 0; border-radius: 12px; font-weight: 700; background: linear-gradient(90deg,#6366f1,#a855f7); }
    .primary:disabled { opacity: .5; cursor: default; }
    .ghost { padding: 10px; border-radius: 12px; background: #1a1433; border: 1px solid #3b2f63; flex: 1; }
    .msg { background: #1a1433; border: 1px solid #3b2f63; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .date { font-size: .8rem; opacity: .6; margin-bottom: 6px; }
    .body { white-space: pre-wrap; word-break: break-word; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .styles { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
    .styles button { padding: 8px 12px; border-radius: 999px; background: #1a1433; border: 1px solid #3b2f63; }
    .styles button[aria-pressed="true"] { border-color: #a855f7; box-shadow: 0 0 0 2px rgba(168,85,247,.4); }
    .toolbar { display: flex; gap: 8px; margin: 16px 0; }
    .notice { opacity: .8; min-height: 1.3em; }
    a { color: #a5b4fc; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Mes messages</h1>
    <p class="sub" id="who"></p>

    <!-- Connexion (même compte que sur la page d'accueil) -->
    <section id="login" class="hidden">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <button id="loginBtn" class="primary">Se connecter</button>
      <p class="sub" style="margin-top:12px">Pas encore de compte ? <a href="index.html">Crée ton lien sur la page d'accueil</a>.</p>
    </section>

    <!-- Boîte de réception -->
    <section id="inbox" class="hidden">
      <div id="styles" class="styles" role="group" aria-label="Style de la carte"></div>
      <div id="list"></div>
      <div class="toolbar">
        <button id="refresh" class="ghost">Actualiser</button>
        <button id="copyLink" class="ghost">Copier mon lien</button>
        <button id="logout" class="ghost">Déconnexion</button>
      </div>
      <p class="sub"><a href="index.html">← Accueil</a></p>
    </section>

    <p id="notice" class="notice" role="status">Chargement…</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Même projet Firebase que index.html et envoyer.html
    const firebaseConfig = {
      apiKey: "AIzaSyBqk3L_qkolD41H3yvHEzz4O-Sr15I-Tko",
      authDomain: "gandxoanonymous.firebaseapp.com",
      projectId: "gandxoanonymous",
      storageBucket: "gandxoanonymous.appspot.com",
      messagingSenderId: "836606625364",
      appId: "1:836606625364:web:7150571998131c41c0cfc1",
      measurementId: "G-97TCHJ33KW"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const say = (t) => { $("notice").textContent = t; };

    // ===== Carte de partage (PNG 1080x1920, format story) — design conservé de l'ancienne page =====
    const CARD_W = 1080;
    const CARD_H = 1920;
    const CARD_STYLES = [
      { key: 'classique', name: 'Classique', emoji: '💌', from: '#00d4ff', to: '#1f3ba6' },
      { key: 'azur',      name: 'Azur',      emoji: '💙', from: '#00bfff', to: '#1e90ff' },
      { key: 'ciel',      name: 'Ciel',      emoji: '☁️', from: '#87ceeb', to: '#4682b4' },
      { key: 'royal',     name: 'Royal',     emoji: '👑', from: '#add8e6', to: '#4169e1' },
      { key: 'minuit',    name: 'Minuit',    emoji: '🌙', from: '#b0e0e6', to: '#191970' }
    ];

    const wrapCanvasText = (ctx, text, maxWidth) => {
      const lines = [];
      String(text).split('\n').forEach((paragraph) => {
        const words = paragraph.split(' ');
        let line = '';
        words.forEach((word) => {
          const test = line ? `${line} ${word}` : word;
          if (line && ctx.measureText(test).width > maxWidth) { lines.push(line); line = word; } else { line = test; }
        });
        lines.push(line);
      });
      return lines;
    };

    const fitMessageFont = (ctx, text, maxWidth, maxHeight, opts = {}) => {
      const { fontFamily = 'Inter, sans-serif', fontWeight = 700, lineHeightRatio = 1.35, maxFont = 64, minFont = 30 } = opts;
      for (let fontSize = maxFont; fontSize >= minFont; fontSize -= 2) {
        ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        const lines = wrapCanvasText(ctx, text, maxWidth);
        const lineHeight = fontSize * lineHeightRatio;
        if (lines.length * lineHeight <= maxHeight) return { fontSize, lines, lineHeight };
      }
      ctx.font = `${fontWeight} ${minFont}px ${fontFamily}`;
      const lineHeight = minFont * lineHeightRatio;
      const maxLines = Math.max(1, Math.floor(maxHeight / lineHeight));
      const lines = wrapCanvasText(ctx, text, maxWidth).slice(0, maxLines);
      let last = lines[maxLines - 1] || '';
      while (last.length > 1 && ctx.measureText(`${last}…`).width > maxWidth) last = last.slice(0, -1);
      lines[maxLines - 1] = `${last}…`;
      return { fontSize: minFont, lines, lineHeight };
    };

    const roundRect = (ctx, x, y, w, h, r) => {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    };

    // Les polices web ne sont chargées qu'à l'usage : on force leur chargement avant de dessiner.
    const ensureCardFontsLoaded = async () => {
      const specs = ['400 100px Anton', '700 34px "Hanken Grotesk"', '600 30px "Hanken Grotesk"'];
      try { await Promise.all(specs.map((s) => document.fonts.load(s))); } catch (e) { /* repli sur la police par défaut */ }
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
    };

    const generateCardBlob = async (message, dateStr, style) => {
      await ensureCardFontsLoaded();
      const canvas = document.createElement('canvas');
      canvas.width = CARD_W;
      canvas.height = CARD_H;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 0, CARD_H);
      bg.addColorStop(0, style.from);
      bg.addColorStop(1, style.to);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CARD_W, CARD_H);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#0a2233';
      ctx.font = '400 100px Anton, sans-serif';
      ctx.fillText('SIS', CARD_W / 2, 380);
      ctx.restore();

      const panelX = 90, panelW = CARD_W - 180, innerPadX = 80, innerPadY = 70, dateZoneH = 90;
      const maxTextWidth = panelW - innerPadX * 2;
      const zoneTop = 460, zoneBottom = 1360, zoneHeight = zoneBottom - zoneTop;
      const maxTextHeight = zoneHeight - innerPadY - dateZoneH;

      const upperMessage = (message || '').toUpperCase();
      const { fontSize, lines, lineHeight } = fitMessageFont(ctx, upperMessage, maxTextWidth, maxTextHeight, {
        fontFamily: 'Anton, sans-serif', fontWeight: 400, lineHeightRatio: 1.08, maxFont: 78, minFont: 32
      });
      const panelH = lines.length * lineHeight + innerPadY + dateZoneH;
      const panelY = zoneTop + (zoneHeight - panelH) / 2;

      ctx.save();
      ctx.shadowColor = 'rgba(8, 16, 24, 0.22)';
      ctx.shadowBlur = 44;
      ctx.shadowOffsetY = 16;
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, panelX, panelY, panelW, panelH, 56);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#14141b';
      ctx.font = `400 ${fontSize}px Anton, sans-serif`;
      let ty = panelY + innerPadY + fontSize * 0.8;
      lines.forEach((line) => { ctx.fillText(line, CARD_W / 2, ty); ty += lineHeight; });
      ctx.restore();

      if (dateStr) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = '600 28px "Hanken Grotesk", sans-serif';
        ctx.fillStyle = 'rgba(20, 20, 27, 0.45)';
        ctx.fillText(dateStr, CARD_W / 2, panelY + panelH - 36);
        ctx.restore();
      }

      const ctaLabel = 'ENVOIE-MOI UN MESSAGE ANONYME 👀';
      const pillH = 118, pillCenterY = 1460;
      ctx.save();
      ctx.font = '700 34px "Hanken Grotesk", sans-serif';
      ctx.letterSpacing = '3px';
      const ctaTextWidth = ctx.measureText(ctaLabel).width;
      const pillW = Math.min(CARD_W - 140, ctaTextWidth + 56 * 2);
      const pillX = (CARD_W - pillW) / 2;
      const pillY = pillCenterY - pillH / 2;
      roundRect(ctx, pillX, pillY, pillW, pillH, pillH / 2);
      ctx.fillStyle = '#15151a';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f2f1f3';
      ctx.fillText(ctaLabel, CARD_W / 2, pillCenterY);
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '600 30px "Hanken Grotesk", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.fillText(window.location.host, CARD_W / 2, pillCenterY + pillH / 2 + 55);
      ctx.restore();

      const decos = [
        { char: '🤫', cx: 60, cy: 250, size: 230, rotate: -12, alpha: 0.85 },
        { char: '👀', cx: CARD_W - 40, cy: 860, size: 260, rotate: 12, alpha: 0.8 },
        { char: '💌', cx: 50, cy: CARD_H - 560, size: 210, rotate: 8, alpha: 0.85 },
        { char: '✨', cx: CARD_W - 45, cy: CARD_H - 300, size: 220, rotate: -10, alpha: 0.8 }
      ];
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      decos.forEach((d) => {
        ctx.save();
        ctx.globalAlpha = d.alpha;
        ctx.translate(d.cx, d.cy);
        ctx.rotate((d.rotate * Math.PI) / 180);
        ctx.font = `${d.size}px sans-serif`;
        ctx.fillText(d.char, 0, 0);
        ctx.restore();
      });

      return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    };
    // ===== Fin carte de partage =====

    let username = "";
    let currentStyle = CARD_STYLES[0];
    const shareLink = () => `${location.origin}/?to=${encodeURIComponent(username)}`;
    const show = (id) => { ["login", "inbox"].forEach((s) => $(s).classList.toggle("hidden", s !== id)); };

    function renderStyles() {
      $("styles").replaceChildren();
      for (const s of CARD_STYLES) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = `${s.emoji} ${s.name}`;
        b.setAttribute("aria-pressed", String(s === currentStyle));
        b.addEventListener("click", () => { currentStyle = s; renderStyles(); });
        $("styles").append(b);
      }
    }

    // Affichage sécurisé : textContent uniquement, jamais innerHTML.
    function render(items) {
      const list = $("list");
      list.replaceChildren();
      if (items.length === 0) {
        say("📭 Aucun message pour le moment. Partage ton lien pour en recevoir !");
        return;
      }
      say(`${items.length} message(s)`);
      for (const m of items) {
        const card = document.createElement("div");
        card.className = "msg";

        const date = document.createElement("div");
        date.className = "date";
        const d = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
        const dateStr = d ? d.toLocaleString("fr-FR") : "";
        date.textContent = dateStr;

        const body = document.createElement("div");
        body.className = "body";
        body.textContent = m.message;

        const row = document.createElement("div");
        row.className = "row";
        const dl = document.createElement("button");
        dl.type = "button";
        dl.className = "primary";
        dl.textContent = "⬇ Télécharger la carte";
        dl.addEventListener("click", () => downloadCard(m.message, dateStr, dl));
        row.append(dl);

        card.append(date, body, row);
        list.append(card);
      }
    }

    async function downloadCard(message, dateStr, btn) {
      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = "Génération…";
      try {
        const blob = await generateCardBlob(message, dateStr, currentStyle);
        const file = new File([blob], `SIS-message-${currentStyle.key}.png`, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "Message anonyme SIS", text: "Réponds-moi anonymement 👀", url: shareLink() });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = file.name;
          a.click();
          URL.revokeObjectURL(url);
        }
      } catch (e) {
        if (e.name !== "AbortError") say("❌ Erreur lors de la génération de la carte.");
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    // Le pseudo du compte est celui enregistré à l'inscription (users/{uid}.username).
    async function resolveUsername(user) {
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists() && snap.data().username) return String(snap.data().username).toLowerCase();
      } catch (e) { console.error("Profil illisible:", e); }
      return user.displayName ? String(user.displayName).toLowerCase() : "";
    }

    async function load() {
      say("Chargement…");
      $("list").replaceChildren();
      if (!username) { say("❌ Pseudo introuvable pour ce compte."); return; }
      try {
        let snap;
        try {
          snap = await getDocs(query(collection(db, "messages"), where("to", "==", username), orderBy("createdAt", "desc")));
        } catch (e) {
          if (e.code !== "failed-precondition") throw e;
          // Index absent : on charge sans tri serveur et on trie ici.
          snap = await getDocs(query(collection(db, "messages"), where("to", "==", username)));
        }
        const items = snap.docs.map((d) => d.data());
        items.sort((a, b) => {
          const ta = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().getTime() : 0;
          const tb = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().getTime() : 0;
          return tb - ta;
        });
        render(items);
      } catch (e) {
        say("❌ Impossible de charger les messages (" + (e.code || "erreur") + ").");
      }
    }

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { say("⚠️ Entre ton email et ton mot de passe."); return; }
      $("loginBtn").disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        say(e.code === "auth/too-many-requests" ? "❌ Trop de tentatives. Réessaie plus tard." : "❌ Email ou mot de passe incorrect.");
      } finally {
        $("loginBtn").disabled = false;
      }
    });
    $("password").addEventListener("keypress", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

    $("refresh").addEventListener("click", load);
    $("logout").addEventListener("click", async () => { await signOut(auth); });
    $("copyLink").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(shareLink()); say("✅ Lien copié."); }
      catch (e) { say("Copie impossible : " + shareLink()); }
    });

    renderStyles();
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        username = "";
        $("who").textContent = "";
        show("login");
        say("Connecte-toi pour voir tes messages.");
        return;
      }
      username = await resolveUsername(user);
      $("who").textContent = username ? "@" + username : "";
      show("inbox");
      load();
    });
  </script>
</body>
</html>
